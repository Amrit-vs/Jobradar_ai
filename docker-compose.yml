services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-jobradar}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_RESUME_SIZE_MB: ${MAX_RESUME_SIZE_MB:-10}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-local-user@jobradar.test}
      DEVELOPMENT_USER_NAME: ${DEVELOPMENT_USER_NAME:-Local User}
      MATCHING_SKILL_WEIGHT: ${MATCHING_SKILL_WEIGHT:-0.6}
      MATCHING_TEXT_WEIGHT: ${MATCHING_TEXT_WEIGHT:-0.4}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

